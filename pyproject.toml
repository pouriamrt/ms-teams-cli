[project]
name = "ms-teams-cli"
version = "0.1.0"
description = "Command-line client for Microsoft Teams chats (DMs, group, meeting)"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pouria Mortezaagha", email = "pouriamortezaagha7@gmail.com" }]
keywords = ["microsoft-teams", "cli", "chat", "microsoft-graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "filelock>=3.14.0",
    "dateparser>=1.2.0",
    "tzlocal>=5.2",
    "html2text>=2024.2.26",
    "tomli-w>=1.0.0",
    "truststore>=0.10.4",
    "certifi>=2026.5.20",
]

[project.urls]
Homepage = "https://github.com/pouriamrt/ms-teams-cli"
Repository = "https://github.com/pouriamrt/ms-teams-cli"
Issues = "https://github.com/pouriamrt/ms-teams-cli/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-vcr>=1.0.2",
    "respx>=0.21.0",
    "syrupy>=4.6.0",
    "hypothesis>=6.100.0",
    "freezegun>=1.5.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "jsonschema>=4.20.0",
]

[project.scripts]
teams = "teams_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teams_cli"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4", "SIM"]
ignore = [
    "N818",    # error classes are named ...Error, not ...Exception
    "SIM115",  # atomic writes deliberately hold a NamedTemporaryFile across try/finally
    "UP042",   # str+Enum (not StrEnum) keeps Pydantic serialization stable
    "B008",    # RetryPolicy() default is a frozen dataclass, safe to evaluate once
]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "e2e: end-to-end tests against real Graph (gated by TEAMS_CLI_E2E)",
]

[tool.coverage.run]
source = ["src/teams_cli"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[dependency-groups]
dev = [
    "types-dateparser>=1.4.0.20260518",
    "types-jsonschema>=4.26.0.20260518",
]
