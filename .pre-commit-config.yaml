repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # syrupy snapshots record Rich's cell padding — trailing spaces are significant
      - id: trailing-whitespace
        exclude: \.ambr$
      - id: end-of-file-fixer
        exclude: \.ambr$
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false
